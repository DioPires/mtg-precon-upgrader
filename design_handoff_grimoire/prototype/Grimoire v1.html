<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grimoire v1 — Arcane Terminal × Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+DW+Pica:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gv1-tokens.css?v=1">
<link rel="stylesheet" href="gv1-states.css?v=1">
<link rel="stylesheet" href="gv1-styles.css?v=9">
<link rel="stylesheet" href="gv1-compare.css?v=1">
<link rel="stylesheet" href="gv1-shopping.css?v=1">
<link rel="stylesheet" href="gv1-scrying.css?v=3">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="gv1-real-decks.js?v=7"></script>
<script src="gv1-data.js?v=9"></script>
<script src="gv1-cards.js?v=1"></script>
<script src="gv1-game-changers.js?v=1"></script>
<script type="text/babel" src="design-canvas.jsx?v=7"></script>
<script type="text/babel" src="gv1-chrome.jsx?v=8"></script>
<script type="text/babel" src="gv1-engine.jsx?v=7"></script>
<script type="text/babel" src="gv1-perf.jsx?v=7"></script>
<script type="text/babel" src="gv1-mobile.jsx?v=7"></script>
<script type="text/babel" src="gv1-codex.jsx?v=1"></script>
<script type="text/babel" src="gv1-cardhover.jsx?v=1"></script>
<script type="text/babel" src="gv1-compare.jsx?v=1"></script>
<script type="text/babel" src="gv1-shopping.jsx?v=1"></script>
<script type="text/babel" src="gv1-scrying.jsx?v=2"></script>

<script type="text/babel">
const { DECKS, DECK_MAP, DECK_FULL } = window.GV1_DATA;
const { useState } = React;

// Resolve a selector idx to its full-deck object.
function deckByIdx(idx) {
  return DECK_FULL.find(d => {
    const e = DECKS.find(s => s.slug === d.slug);
    return e && e.idx === idx;
  }) || DECK_FULL[0];
}

function GuideArtboard({ activeIdx, setActiveIdx }) {
  const active = deckByIdx(activeIdx);
  return (
    <div className="gv1-root" data-screen-label="01 Guide" data-gv1-screen="guide">
      <GV1Topbar screen="guide" />
      <GV1DeckSelector decks={DECKS} activeIdx={activeIdx} onSelect={setActiveIdx} />
      <GV1Commander deck={active} />
      <GV1WinCons wincons={active.wincons} />
      <GV1Engine engine={active.engine} />
      <GV1Combos combos={active.combos} />
      <GV1Apothecary apothecary={active.apothecary} />
      <GV1Performance curve={active.curve} func={active.func} sources={active.sources} health={active.health} composition={active.composition} assessment={active.assessment} />
      <GV1Decklist list={active.list} />
    </div>
  );
}

function PerformanceArtboard() {
  return <GV1Codex decks={DECK_FULL} />;
}

function MobileArtboard({ activeIdx }) {
  // Mobile bezel doesn't show desktop chrome, so wrap to expose data-gv1-screen
  // for the nav helper without changing the visual.
  return (
    <div data-gv1-screen="mobile" data-screen-label="03 Mobile" style={{ width: '100%', height: '100%' }}>
      <GV1Mobile deck={deckByIdx(activeIdx)} />
    </div>
  );
}

function MobileScryingArtboard({ activeIdx }) {
  // Scrying on mobile: full feature parity, just reflowed via @media queries
  // in gv1-scrying.css. Same component as desktop — no separate codepath.
  return (
    <div data-gv1-screen="mobile-scrying" data-screen-label="08 Mobile Scrying" style={{ width: '100%', height: '100%', overflowY: 'auto' }}>
      <GV1Scrying deck={deckByIdx(activeIdx)} />
    </div>
  );
}

// Cross-deck tools. All three are real, fully-interactive surfaces backed
// by deck.json + simulation.json + Scryfall.
function ScryingArtboard({ activeIdx }) {
  return <GV1Scrying deck={deckByIdx(activeIdx)} />;
}
function ShoppingArtboard() {
  return <GV1Shopping allDecks={DECK_FULL} />;
}
function CompareArtboard({ setActiveIdx }) {
  return <GV1Compare allDecks={DECK_FULL} onSelectDeck={setActiveIdx} />;
}

function App() {
  // Lifted: shared between guide artboard (writes via selector) and mobile (reads).
  const [activeIdx, setActiveIdx] = useState(1);
  return (
    <React.Fragment>
    <GV1CardHoverLayer />
    <DesignCanvas initialZoom={0.5}>
      <DCSection id="grimoire" title="Grimoire v1" subtitle="Arcane Terminal meets card-forward gallery. IM Fell serif, JetBrains Mono, ink blue + rune green on grid, with larger card tiles.">
        <DCArtboard id="guide" label="Desktop · Deck Guide" width={1440} height={12200}>
          <GuideArtboard activeIdx={activeIdx} setActiveIdx={setActiveIdx} />
        </DCArtboard>
        <DCArtboard id="perf" label="Desktop · Codex Overview" width={1440} height={2300}>
          <PerformanceArtboard />
        </DCArtboard>
        <DCArtboard id="mobile" label="Mobile · iPhone (responsive preview)" width={390} height={844}>
          <MobileArtboard activeIdx={activeIdx} />
        </DCArtboard>
      </DCSection>
      <DCSection id="tools" title="Cross-deck tools" subtitle="Working surfaces that span all 12 decks. Real data, real interactions. Compare ranks every deck; Shopping persists owned cards locally; Scrying simulates draws and weighs swaps against the active deck's full simulation.">
        <DCArtboard id="compare" label="Desktop · Compare" width={1440} height={1600}>
          <CompareArtboard setActiveIdx={setActiveIdx} />
        </DCArtboard>
        <DCArtboard id="shopping" label="Desktop · Shopping List" width={1440} height={3200}>
          <ShoppingArtboard />
        </DCArtboard>
        <DCArtboard id="scrying" label="Desktop · Scrying Pool" width={1440} height={2400}>
          <ScryingArtboard activeIdx={activeIdx} />
        </DCArtboard>
        <DCArtboard id="scrying-mobile" label="Mobile · Scrying Pool" width={390} height={3400}>
          <MobileScryingArtboard activeIdx={activeIdx} />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
