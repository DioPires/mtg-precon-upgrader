name: web-ci

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'data/**'
      - '.github/workflows/web-ci.yml'

defaults:
  run:
    working-directory: web

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    # DEC-1136 measure only: both arms run on one commit in one run.
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Runner size
        run: nproc && free -m
      - name: Playwright (measure)
        run: npx playwright test --repeat-each=3 --retries=0 --workers=${{ matrix.workers }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-w${{ matrix.workers }}
          path: web/playwright-report
          retention-days: 7
