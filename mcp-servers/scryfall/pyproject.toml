[project]
name = "scryfall-mcp"
version = "0.1.0"
description = "MCP server for Scryfall card lookup - structured access to MTG card data with caching"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
scryfall = "scryfall_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scryfall_mcp"]
