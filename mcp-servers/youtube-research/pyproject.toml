[project]
name = "youtube-research"
version = "0.1.0"
description = "MCP server for YouTube video research - fetches transcripts and metadata for MTG content analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "yt-dlp>=2024.0.0",
    "pydantic>=2.0",
]

[project.scripts]
youtube-research = "youtube_research.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_research"]
