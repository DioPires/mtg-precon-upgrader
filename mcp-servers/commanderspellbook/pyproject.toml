[project]
name = "commanderspellbook-mcp"
version = "0.1.0"
description = "MCP server for Commander Spellbook combo lookup with caching"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
commanderspellbook = "commanderspellbook_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commanderspellbook_mcp"]
